config:
  # Default state for all rules
  default: true

  # MD013: Disable line length rule
  MD013: false
  MD024: false
  MD038: false
  MD060: false

  # MD033: Allow the components the demo site shows off
  MD033:
    allowed_elements:
      - FileTree
      - SwaggerUI

  # MD040: Every fenced code block needs a language tag.
  MD040: true

globs:
  - "demo/**/*.md"
  - "*.md"

ignores:
  - "**/node_modules/**"
  - "demo/.vuepress/.temp/**"
  - "demo/.vuepress/.cache/**"
  - "demo/.vuepress/dist/**"
  - "CHANGELOG.md"
